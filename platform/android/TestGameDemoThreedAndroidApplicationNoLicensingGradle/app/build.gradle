android {
    compileSdkVersion 37
    buildToolsVersion = "37.0.0"

    defaultConfig {
        applicationId "org.allbinary.game.testgamedemo"
        minSdkVersion 4
        targetSdkVersion 37
        versionCode 40
        versionName "1.2.18"

        //testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable = true
            }
            shrinkResources true
            //minifyEnabled true (used before 9.3.0 for R8)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'G:/mnt/bc/mydev/work/j2me/games/All_Android.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    namespace 'org.allbinary.game.testgamedemo'
}

